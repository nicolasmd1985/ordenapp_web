name: Deploy to AWS EC2 using K3s

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ordenappweb:latest .
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ordenappweb:latest

    - name: Set up K3s
      run: |
        echo "${{ secrets.AWS_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_EC2_HOST }} "curl -sfL https://get.k3s.io | sh -"

    - name: Deploy to K3s
      run: |
        echo "${{ secrets.AWS_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem
        scp -o StrictHostKeyChecking=no -i private_key.pem ./deployment.yaml ubuntu@${{ secrets.AWS_EC2_HOST }}:/home/ubuntu/
        scp -o StrictHostKeyChecking=no -i private_key.pem ./service.yaml ubuntu@${{ secrets.AWS_EC2_HOST }}:/home/ubuntu/
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_EC2_HOST }} "sudo k3s kubectl apply -f /home/ubuntu/deployment.yaml"
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_EC2_HOST }} "sudo k3s kubectl apply -f /home/ubuntu/service.yaml"
    - name: Run database migrations
      run: |
        echo "${{ secrets.AWS_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.AWS_EC2_HOST }} "docker-compose run web bin/rails db:migrate RAILS_ENV=development"