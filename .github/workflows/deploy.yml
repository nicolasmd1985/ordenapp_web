name: Build, Push, and Deploy Ordenapp

on:
  push:
    branches:
      - production

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ordenappweb:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/ordenappweb:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_KEY }}

      - name: Create .env file
        run: |
          echo "RDS_HOST=${{ secrets.RDS_HOST }}" >> .env.production
          echo "RDS_USERNAME=${{ secrets.RDS_USERNAME }}" >> .env.production
          echo "RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}" >> .env.production
          echo "RDS_PORT=${{ secrets.RDS_PORT }}" >> .env.production
          echo "aws_access_key_id=${{ secrets.aws_access_key_id }}" >> .env.production
          echo "aws_secret_access_key=${{ secrets.aws_secret_access_key }}" >> .env.production
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.production
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env.production
          echo "GOOGLE_MAPS_API_SERVER_KEY=${{ secrets.GOOGLE_MAPS_API_SERVER_KEY }}" >> .env.production
          echo "SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}" >> .env.production
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.production
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env.production
          echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env.production
          echo "EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}" >> .env.production
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env.production
          echo "HOST=${{ secrets.HOST }}" >> .env.production
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production
          echo "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}" >> .env.production
          echo "RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}" >> .env.production
          echo "RAILS_ENV=production" >> .env.production
          echo "ENV=production" >> .env.production
          echo "RAILS_SERVE_STATIC_FILES=true" >> .env.production

      - name: Create deploy script
        run: |
          cat > deploy_script.sh << 'EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"

          # Set environment
          export ENV=production

          WEB_CONTAINER_NAME="ordenapp_web_container"
          TEMP_CONTAINER_NAME="temp_asset_compiler"
          DEPLOY_DIR="$HOME/ordenapp"

          echo "Ensuring Docker network exists..."
          docker network inspect app_network >/dev/null 2>&1 || docker network create app_network

          echo "Starting deployment process..."

          # Stop any running containers and remove them
          echo "Stopping existing containers..."
          docker compose down --remove-orphans || true

          # Pull the latest images
          echo "Pulling latest images..."
          docker compose pull

          # Run migrations and seeds
          echo "Running database migrations and seeds..."
          docker compose run --rm web bundle exec rails db:prepare db:seed

          # Preparing public directory
          echo "Preparing public directory..."
          mkdir -p "$DEPLOY_DIR/public/"
          rm -rf "$DEPLOY_DIR/public/"*

          # Creating temporary container for asset compilation
          echo "Creating temporary container for asset compilation..."
          docker create --name $TEMP_CONTAINER_NAME ${{ secrets.DOCKER_HUB_USERNAME }}/ordenappweb:latest

          # Clearing old assets
          echo "Clearing old assets..."
          docker start $TEMP_CONTAINER_NAME
          docker exec $TEMP_CONTAINER_NAME bundle exec rake assets:clobber

          # Precompiling assets
          echo "Precompiling assets..."
          docker exec $TEMP_CONTAINER_NAME bundle exec rake assets:precompile

          # Copying assets from temporary container
          echo "Copying assets from temporary container..."
          docker cp "${TEMP_CONTAINER_NAME}:/app/public/ordenapp/assets" "$DEPLOY_DIR/public/"

          # Verify asset copy
          ASSET_COUNT=$(find "$DEPLOY_DIR/public/assets" -type f | wc -l || echo 0)
          if [ "$ASSET_COUNT" -lt 10 ]; then
              echo "Error: Very few assets were copied. Expected more than 10 files."
              echo "Current asset count: $ASSET_COUNT"
              echo "Checking temporary container's public directory..."
              docker exec $TEMP_CONTAINER_NAME ls -la /app/public/ordenapp/assets || true
              echo "Checking host's public directory..."
              ls -la "$DEPLOY_DIR/public/assets" || true
              exit 1
          fi

          # Cleaning up temporary container
          echo "Cleaning up temporary container..."
          docker stop $TEMP_CONTAINER_NAME || true
          docker rm $TEMP_CONTAINER_NAME || true

          # Start the main containers in detached mode
          echo "Starting containers..."
          docker compose up -d --remove-orphans

          # Wait for containers to be healthy
          echo "Waiting for containers to be healthy..."
          sleep 15

          # Check if web container is running
          if ! docker compose ps web | grep -q "Up"; then
            echo "Error: Web container failed to start"
            docker compose logs web
            exit 1
          fi

          # Setting permissions for deployed assets
          echo "Setting permissions for deployed assets..."
          sudo chown -R $(whoami):$(whoami) "$DEPLOY_DIR/public" || chown -R $(whoami):$(whoami) "$DEPLOY_DIR/public" || true
          find "$DEPLOY_DIR/public" -type d -exec chmod 755 {} \; || true
          find "$DEPLOY_DIR/public" -type f -exec chmod 644 {} \; || true
          chmod 755 "$DEPLOY_DIR" || true

          # Clean up old images and volumes
          echo "Cleaning up old images and volumes..."
          docker image prune -f
          docker volume prune -f

          echo "Deployment completed successfully!"
          EOF
          chmod +x deploy_script.sh

      - name: Ensure deploy directory exists
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER || 'nicolasmelectronic' }}@${{ secrets.AWS_EC2_HOST }} 'mkdir -p ~/ordenapp && chmod 755 ~/ordenapp'

      - name: Copy files to server
        run: |
          scp -o StrictHostKeyChecking=no .env.production ${{ secrets.SSH_USER || 'nicolasmelectronic' }}@${{ secrets.AWS_EC2_HOST }}:~/ordenapp/
          scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER || 'nicolasmelectronic' }}@${{ secrets.AWS_EC2_HOST }}:~/ordenapp/
          scp -o StrictHostKeyChecking=no deploy_script.sh ${{ secrets.SSH_USER || 'nicolasmelectronic' }}@${{ secrets.AWS_EC2_HOST }}:~/ordenapp/

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.SSH_USER || 'nicolasmelectronic' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/ordenapp/
            chmod +x deploy_script.sh
            ./deploy_script.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.SSH_USER || 'nicolasmelectronic' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/ordenapp/
            docker compose ps
            docker compose logs --tail=50 web
