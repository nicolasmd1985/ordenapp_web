version: '3'
services:
  redis:
    image: redis:6.2
    networks:
      - app_network
  web:
    #for production dont use volumes
    # network_mode: "host"      
    # volumes:
    #   - .:/app
    build: .
    image: nicolasmd/ordenappweb:latest
    container_name: ordenapp_web_container
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env.${ENV}
    environment:
      TZ: America/New_York
      RAILS_ENV: ${ENV}
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_RELATIVE_URL_ROOT: /ordenapp
    command: bash -c "bundle exec rake assets:precompile && bundle exec puma -C config/puma.rb"
    volumes:
      - ./public:/app/public
    networks:
      - app_network
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge