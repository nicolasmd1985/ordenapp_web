version: '3'
services:
  redis:
    image: redis:6.2
    networks:
      - app_network
  
  web:
    build: .
    image: nicolasmd/ordenappweb:latest
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - redis
#      - db
    env_file:
      - .env.${ENV}
    environment:
      RAILS_ENV: ${ENV}
    networks:
      - app_network

networks:
  app_network: